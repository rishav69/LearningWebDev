<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paragraph and Images</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .content {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .text {
      flex: 1;
    }

    .images {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .images img {
      width: 200px;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Page</h1>

  <div class="content">
    <div class="text">
      <p>
        This is a simple web page with an aligned paragraph and a couple of images.
        Flexbox is used here to align text and images side by side neatly. You can easily
        customize the layout further to suit your design.
      </p>
    </div>

    <div class="images">
      <img src="https://images.jdmagicbox.com/comp/ghaziabad/r3/011pxx11.xx11.170921160251.s3r3/catalogue/abes-engineering-college-vijay-nagar-ghaziabad-ghaziabad-colleges-ooyzulshwd.jpg" alt="Placeholder 1">
      <img src="https://shorturl.at/t2yHT" alt="Placeholder 2">
    </div>
  </div>

</body>
</html>
