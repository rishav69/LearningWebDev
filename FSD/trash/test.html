<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Animation</title>
  <style>
    /* Style the scroll element */
    .scroll-element {
      opacity: 0; /* Initially hidden */
      transform: translateY(50px); /* Initially moved down */
      transition: opacity 0.5s ease, transform 0.5s ease; /* Smooth transition */
      height: 200px; /* Just to make it visible */
      background-color: lightblue;
      margin: 1000px 0; /* Added margin for scroll effect */
      text-align: center;
      line-height: 200px;
    }

    /* Visible class to trigger the animation */
    .scroll-element.visible {
      opacity: 1; /* Fully visible */
      transform: translateY(0); /* Move to original position */
    }
  </style>
</head>
<body>
  <div class="scroll-element">
    Scroll down to trigger the animation!
  </div>

  <script>
    // Function to check if the element is in the viewport
    function isInViewport(element) {
      const rect = element.getBoundingClientRect();
      return (
        rect.top >= 0 &&
        rect.left >= 0 &&
        rect.bottom <= (window.innerHeight || document.documentElement.clientHeight) &&
        rect.right <= (window.innerWidth || document.documentElement.clientWidth)
      );
    }

    // Function to handle scroll event
    function handleScroll() {
      const element = document.querySelector('.scroll-element');
      if (isInViewport(element)) {
        element.classList.add('visible');
      }
    }

    // Attach the scroll event to the window
    window.addEventListener('scroll', handleScroll);

    // Also trigger the scroll event in case the element is already in view when the page loads
    handleScroll();
  </script>
</body>
</html>
