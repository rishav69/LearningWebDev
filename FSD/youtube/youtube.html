<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <link rel="stylesheet" href="youtube.css">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Sofadi+One&display=swap" rel="stylesheet">

</head>
<body>
    
    <div class="main">
        <div class="nav">

            <div class="nav-left">
                <i class="ri-menu-line"></i>
                <img src="images/3146788_youtube_logo_icon.png" alt="logo">
                <h1>YouTube</h1>
            </div>            
            <div class="search">
                <form action="https://www.youtube.com/results">
                    <input type="text" placeholder="search" name="q">
                    <button><i class="ri-search-line"></i></button>
                </form>
            </div>
            <div class="nav-right">
                <button>
                    <i class="ri-add-line"></i>
                    Create
                </button>
                <button>
                    <i class="ri-notification-2-line"></i>
                </button>
                <button>
                    <i class="ri-user-line"></i>
                </button>
            </div>

        </div>
    </div>

</body>
</html>
